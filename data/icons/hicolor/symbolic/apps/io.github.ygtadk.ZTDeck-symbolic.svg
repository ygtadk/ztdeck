<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Symbolic variant of the app icon: monochrome and simplified so it stays
       legible at 16px in headers, notifications and the shell. Mirrors the app
       icon's motif (node mark beside a D) without the background plate.

       Keep comments INSIDE this element: gdk-pixbuf sniffs the start of the
       file to detect the format, and a comment before the root element makes
       `flatpak build-export` reject the icon as "Format not recognized". -->
  <g fill="#222222">
    <!-- Node mark: cross bar with a pendant ring -->
    <rect x="0.8" y="2.4" width="6.6" height="1.2" rx="0.6"/>
    <rect x="3.5" y="3.2" width="1.2" height="2.2" rx="0.6"/>
    <path d="M4.1 5.1a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6zm0 1.3a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    <rect x="3.5" y="9.4" width="1.2" height="3.2" rx="0.6"/>
    <!-- D -->
    <path d="M8.4 2.4h2.3c2.4 0 4 1.9 4 5.3s-1.6 5.3-4 5.3H8.4zm1.4 1.3v8h0.9c1.6 0 2.6-1.4 2.6-4s-1-4-2.6-4z"/>
  </g>
</svg>
